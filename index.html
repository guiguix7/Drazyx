<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070810" />

  <!-- Fonts: preconnect + <link> (faster than a CSS @import) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Defaults for crawlers that don't run JS. Each page overrides these via the SEO component. -->
  <title>Drazyx — artist / producer</title>
  <meta name="description"
    content="Drazyx is an independent artist and producer making atmospheric, melancholic music between trap, electronic and lo-fi. Listen, explore the catalog and step into The Room." />
  <link rel="canonical" href="https://drazyx.com/" />
  <!-- Keep this in sync with VITE_SITE_URL, public/sitemap.xml and public/robots.txt if the domain changes. -->

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Drazyx" />
  <meta property="og:title" content="Drazyx — artist / producer" />
  <meta property="og:description"
    content="Independent artist and producer. Atmospheric, melancholic music between trap, electronic and lo-fi." />
  <meta property="og:url" content="https://drazyx.com/" />
  <meta property="og:image" content="https://f4.bcbits.com/img/a587586965_10.jpg" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Drazyx — artist / producer" />
  <meta name="twitter:description" content="Atmospheric, melancholic music between trap, electronic and lo-fi." />
  <meta name="twitter:image" content="https://f4.bcbits.com/img/a587586965_10.jpg" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "name": "Drazyx",
        "url": "https://drazyx.com/",
        "genre": ["Trap", "Electronic", "Lo-fi", "Phonk", "Jersey Club"],
        "sameAs": [
          "https://open.spotify.com/intl-pt/artist/71gVcrLVY10LjtZWvUWLQU",
          "https://www.instagram.com/drazyxmusic/",
          "https://www.tiktok.com/@drazyxmusic",
          "https://www.youtube.com/@drazyxmusic",
          "https://soundcloud.com/drazyxmusic",
          "https://drazyx.bandcamp.com/"
        ]
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
